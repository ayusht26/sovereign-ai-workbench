<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slideshow Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="slideshow-container">
        <div class="slide fade active">
            <img src="https://picsum.photos/id/1015/800/600" alt="Beautiful Landscape">
        </div>
        
        <div class="slide fade">
            <img src="https://picsum.photos/id/1039/800/600" alt="Mountain Lake">
        </div>
        
        <div class="slide fade">
            <img src="https://picsum.photos/id/237/800/600" alt="Siberian Husky">
        </div>
        
        <div class="slide fade">
            <img src="https://picsum.photos/id/160/800/600" alt="Sunset Beach">
        </div>
        
        <div class="slide fade">
            <img src="https://picsum.photos/id/457/800/600" alt="Purple Flowers">
        </div>
        
        <div class="slide fade">
            <img src="https://picsum.photos/id/234/800/600" alt="Bamboo Forest">
        </div>
    </div>

    <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
    <a class="next" onclick="changeSlide(1)">&#10095;</a>

    <script src="script.js"></script>
</body>
</html>
