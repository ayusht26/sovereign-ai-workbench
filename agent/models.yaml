# Bastion — Default Model Configuration
# ─────────────────────────────────────────────────────────────────────────────
# All inference goes through the OpenAI API.
# Model display names shown in the TUI match the website's sovereign naming.
# The actual API model is gpt-4o-mini for all categories (fast, cheap).
#
# API keys are read from environment variables, never stored here.
# Set OPENAI_API_KEY in your shell or in agent/.env
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Provider
# ─────────────────────────────────────────────────────────────────────────────
provider:
  mode: "api"
  base_url: "https://api.openai.com/v1"
  api_key_env: "OPENAI_API_KEY"
  app_url: null
  request_timeout_s: 60

# ─────────────────────────────────────────────────────────────────────────────
# Router
# ─────────────────────────────────────────────────────────────────────────────
# Classifies every request before selecting a worker model.
# Now also runs via OpenAI (gpt-4o-mini is fast and cheap enough).
#
router:
  model: "gpt-4o-mini"
  fallback: "gpt-4o-mini"
  keep_alive: -1
  temperature: 0
  max_tokens: 40

# ─────────────────────────────────────────────────────────────────────────────
# Worker models
# ─────────────────────────────────────────────────────────────────────────────
# api: OpenAI model ID used for inference.
# display_name: Label shown in the TUI (matches the website's sovereign naming).
#
models:
  general:
    api: "gpt-4o-mini"
    display_name: "Qwen3.5-9B"           # shown in TUI / routing line
    api_fallback: "gpt-4o-mini"
  coding:
    api: "gpt-4o-mini"
    display_name: "Qwen3-Coder-Next"
    api_fallback: "gpt-4o-mini"
  vision:
    api: "gpt-4o-mini"
    display_name: "Qwen3-VL-32B"
    api_fallback: "gpt-4o-mini"
  document_qa:
    api: "gpt-4o-mini"
    display_name: "Qwen3.5-9B"
    api_fallback: "gpt-4o-mini"
  spreadsheet:
    api: "gpt-4o-mini"
    display_name: "Qwen3.5-9B"
    api_fallback: "gpt-4o-mini"

  # Embeddings — use OpenAI text-embedding-3-small for Supabase pgvector
  embedding:
    model: "text-embedding-3-small"
    display_name: "Embedding v3 Small"

# ─────────────────────────────────────────────────────────────────────────────
# Supabase (RAG backend — same database as the web application)
# ─────────────────────────────────────────────────────────────────────────────
supabase:
  url: "https://tybbzdbglhfnpdvgvrjs.supabase.co"
  anon_key_env: "SUPABASE_ANON_KEY"
  # Default anon key (public — same as frontend/.env)
  anon_key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5YmJ6ZGJnbGhmbnBkdmd2cmpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MDc5NjYsImV4cCI6MjEwMzQ4Mzk2Nn0.ooAz_wKezqDKd-XxKAI_xZlkY1Hu8w_Tk5EEtzyCYzo"

# ─────────────────────────────────────────────────────────────────────────────
# Workspace settings
# ─────────────────────────────────────────────────────────────────────────────
workspace:
  allow_list: []
  auto_approve_new_files: true
  require_diff_preview: true

# ─────────────────────────────────────────────────────────────────────────────
# Sandbox (Docker code execution — optional)
# ─────────────────────────────────────────────────────────────────────────────
sandbox:
  enabled: true
  memory_limit: "2g"
  cpu_limit: 2.0
  timeout_s: 60
  images:
    python: "python:3.11-slim"
    node: "node:20-slim"
    gcc: "gcc:13"

# ─────────────────────────────────────────────────────────────────────────────
# Knowledge base (Supabase-backed)
# ─────────────────────────────────────────────────────────────────────────────
knowledge_base:
  path: "~/.bastion/kb"
  chunk_size_tokens: 500
  chunk_overlap_tokens: 50
  max_results: 5
  max_chunk_tokens: 800

# ─────────────────────────────────────────────────────────────────────────────
# Network guard
# ─────────────────────────────────────────────────────────────────────────────
net_guard:
  enabled: true
  poll_interval_ms: 500
  allowed_hosts:
    - "127.0.0.1"
    - "localhost"
    - "::1"
    - "api.openai.com"
    - "tybbzdbglhfnpdvgvrjs.supabase.co"

# ─────────────────────────────────────────────────────────────────────────────
# Audit log
# ─────────────────────────────────────────────────────────────────────────────
audit:
  path: "~/.bastion/audit"
  redact_content: false

# ─────────────────────────────────────────────────────────────────────────────
# Agent loop
# ─────────────────────────────────────────────────────────────────────────────
agent:
  max_iterations: 25
