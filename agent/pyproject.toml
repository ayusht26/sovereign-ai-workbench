[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bastion"
version = "0.2.0"
description = "Bastion — Sovereign agentic AI workbench powered by OpenAI + Supabase RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bastion Team" }]
keywords = ["ai", "llm", "openai", "supabase", "tui", "agent", "rag"]

dependencies = [
    # TUI
    "textual>=0.85.0",
    "rich>=13.9.0",
    # CLI
    "typer>=0.12.0",
    # Config
    "pyyaml>=6.0.2",
    "python-dotenv",
    # LLM — OpenAI API
    "openai>=1.40.0",
    # HTTP client (used by streaming)
    "httpx>=0.27.0",
    # Supabase (RAG backend — same DB as web app)
    "supabase>=2.7.0",
    # Office file generation
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    # PDF handling
    "pymupdf>=1.24.13",
    "pdf2image>=1.17.0",
    # Network monitoring
    "psutil>=6.1.0",
    # Docker SDK (optional — for sandbox_exec tool)
    "docker>=7.1.0",
    # Image handling for vision tool
    "Pillow>=11.0.0",
    # Date/time utilities
    "python-dateutil>=2.9.0",
    # Watchdog for KB watch mode
    "watchdog>=5.0.3",
    # Token counting
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
]

[project.scripts]
bastion = "sovereignai.cli:main"

[project.urls]
Homepage = "https://github.com/internal/bastion"
Repository = "https://github.com/internal/bastion"

[tool.hatch.build.targets.wheel]
packages = ["sovereignai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

